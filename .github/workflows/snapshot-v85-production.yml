name: Snapshot Villa Almale production for V8.5

on:
  push:
    paths:
      - '.github/workflows/snapshot-v85-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Download current production files
        env:
          DEPLOY_SCHEME: ${{ secrets.INFOMANIAK_SCHEME }}
          DEPLOY_HOST: ${{ secrets.INFOMANIAK_HOST }}
          DEPLOY_PORT: ${{ secrets.INFOMANIAK_PORT }}
          DEPLOY_USER: ${{ secrets.INFOMANIAK_USER }}
          DEPLOY_PASSWORD: ${{ secrets.INFOMANIAK_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.INFOMANIAK_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_SCHEME:?Missing INFOMANIAK_SCHEME}"
          : "${DEPLOY_HOST:?Missing INFOMANIAK_HOST}"
          : "${DEPLOY_PORT:?Missing INFOMANIAK_PORT}"
          : "${DEPLOY_USER:?Missing INFOMANIAK_USER}"
          : "${DEPLOY_PASSWORD:?Missing INFOMANIAK_PASSWORD}"
          : "${DEPLOY_PATH:?Missing INFOMANIAK_PATH}"
          test "$DEPLOY_PATH" = "sites/PageWebbasique1"
          case "$DEPLOY_SCHEME" in
            sftp) EXTRA_SETTINGS="set sftp:auto-confirm yes;" ;;
            ftp) EXTRA_SETTINGS="set ftp:ssl-allow no; set ftp:passive-mode yes;" ;;
            ftps) EXTRA_SETTINGS="set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ftp:passive-mode yes;" ;;
            *) echo "Unsupported scheme"; exit 1 ;;
          esac
          mkdir -p snapshot/en snapshot/es snapshot/sv snapshot/off-season/fr snapshot/off-season/es snapshot/off-season/sv snapshot/off-season/assets snapshot/assets/js
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set net:timeout 30;
            $EXTRA_SETTINGS
            open -p $DEPLOY_PORT -u \"$DEPLOY_USER\",\"$DEPLOY_PASSWORD\" $DEPLOY_SCHEME://$DEPLOY_HOST;
            get \"$DEPLOY_PATH/index.html\" -o snapshot/index.html;
            get \"$DEPLOY_PATH/en/index.html\" -o snapshot/en/index.html;
            get \"$DEPLOY_PATH/es/index.html\" -o snapshot/es/index.html;
            get \"$DEPLOY_PATH/reservation.html\" -o snapshot/reservation.html;
            get \"$DEPLOY_PATH/en/reservation.html\" -o snapshot/en/reservation.html;
            get \"$DEPLOY_PATH/es/reservation.html\" -o snapshot/es/reservation.html;
            get \"$DEPLOY_PATH/sv/reservation.html\" -o snapshot/sv/reservation.html;
            get \"$DEPLOY_PATH/off-season/index.html\" -o snapshot/off-season/index.html;
            get \"$DEPLOY_PATH/off-season/fr/index.html\" -o snapshot/off-season/fr/index.html;
            get \"$DEPLOY_PATH/off-season/es/index.html\" -o snapshot/off-season/es/index.html;
            get \"$DEPLOY_PATH/off-season/sv/index.html\" -o snapshot/off-season/sv/index.html;
            get \"$DEPLOY_PATH/off-season/assets/styles.css\" -o snapshot/off-season/assets/styles.css;
            get \"$DEPLOY_PATH/assets/js/audience.js\" -o snapshot/assets/js/audience.js;
            bye
          "
          find snapshot -type f -maxdepth 5 -print | sort
          test -s snapshot/index.html
          test -s snapshot/en/index.html
          test -s snapshot/es/index.html
          test -s snapshot/off-season/sv/index.html
          tar -czf villa-almale-production-v85-source.tar.gz -C snapshot .

      - name: Upload production snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: villa-almale-production-v85-source
          path: villa-almale-production-v85-source.tar.gz
          retention-days: 7
          if-no-files-found: error
