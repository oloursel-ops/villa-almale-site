name: Trigger Villa Almale V8.1 once
run-name: Dispatch V8.1 production deployment and disable this trigger

on:
  schedule:
    - cron: '31 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.repository == 'oloursel-ops/villa-almale-site' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch V8.1 deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/deploy-v8-1-offseason-conversion.yml/dispatches" \
            --data '{"ref":"main"}'

      - name: Disable this one-shot trigger
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/trigger-v8-1-once.yml/disable"
