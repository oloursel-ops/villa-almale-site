name: Deploy Swedish landing V8.9.4

on:
  push:
    paths:
      - 'releases/v894-sv-hero/RUN'

concurrency:
  group: villa-almale-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Download current production files
        env:
          DEPLOY_SCHEME: ${{ secrets.INFOMANIAK_SCHEME }}
          DEPLOY_HOST: ${{ secrets.INFOMANIAK_HOST }}
          DEPLOY_PORT: ${{ secrets.INFOMANIAK_PORT }}
          DEPLOY_USER: ${{ secrets.INFOMANIAK_USER }}
          DEPLOY_PASSWORD: ${{ secrets.INFOMANIAK_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.INFOMANIAK_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_SCHEME:?Missing INFOMANIAK_SCHEME}"
          : "${DEPLOY_HOST:?Missing INFOMANIAK_HOST}"
          : "${DEPLOY_PORT:?Missing INFOMANIAK_PORT}"
          : "${DEPLOY_USER:?Missing INFOMANIAK_USER}"
          : "${DEPLOY_PASSWORD:?Missing INFOMANIAK_PASSWORD}"
          : "${DEPLOY_PATH:?Missing INFOMANIAK_PATH}"
          test "$DEPLOY_PATH" = "sites/PageWebbasique1"
          case "$DEPLOY_SCHEME" in
            sftp) EXTRA_SETTINGS="set sftp:auto-confirm yes;" ;;
            ftp) EXTRA_SETTINGS="set ftp:ssl-allow no; set ftp:passive-mode yes;" ;;
            ftps) EXTRA_SETTINGS="set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ftp:passive-mode yes;" ;;
            *) echo "Unsupported scheme"; exit 1 ;;
          esac
          mkdir -p work backup
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 3;
            set net:timeout 30;
            $EXTRA_SETTINGS
            open -p $DEPLOY_PORT -u \"$DEPLOY_USER\",\"$DEPLOY_PASSWORD\" $DEPLOY_SCHEME://$DEPLOY_HOST;
            get \"$DEPLOY_PATH/off-season/sv/index.html\" -o work/index.html;
            get \"$DEPLOY_PATH/assets/js/audience.js\" -o work/audience.js;
            bye
          "
          cp work/index.html backup/index.html
          cp work/audience.js backup/audience.js
          sha256sum backup/index.html backup/audience.js > backup/sha256.txt

      - name: Apply V8.9.4 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/v894_sv_patch.py work/index.html work/audience.js
          node --check work/audience.js
          grep -q 'class="sv-hero-price"' work/index.html
          grep -q 'Pris per person beräknat på 7 nätter för 6 vuxna.' work/index.html
          grep -q 'Golf på gångavstånd' work/index.html
          grep -q 'Se lediga datum och totalpris →' work/index.html
          grep -q 'Nödvändiga cookies är alltid aktiva.' work/audience.js

      - name: Deploy patched files
        env:
          DEPLOY_SCHEME: ${{ secrets.INFOMANIAK_SCHEME }}
          DEPLOY_HOST: ${{ secrets.INFOMANIAK_HOST }}
          DEPLOY_PORT: ${{ secrets.INFOMANIAK_PORT }}
          DEPLOY_USER: ${{ secrets.INFOMANIAK_USER }}
          DEPLOY_PASSWORD: ${{ secrets.INFOMANIAK_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.INFOMANIAK_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_SCHEME" in
            sftp) EXTRA_SETTINGS="set sftp:auto-confirm yes;" ;;
            ftp) EXTRA_SETTINGS="set ftp:ssl-allow no; set ftp:passive-mode yes;" ;;
            ftps) EXTRA_SETTINGS="set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ftp:passive-mode yes;" ;;
            *) exit 1 ;;
          esac
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 3;
            set net:timeout 30;
            $EXTRA_SETTINGS
            open -p $DEPLOY_PORT -u \"$DEPLOY_USER\",\"$DEPLOY_PASSWORD\" $DEPLOY_SCHEME://$DEPLOY_HOST;
            put work/index.html -o \"$DEPLOY_PATH/off-season/sv/index.html\";
            put work/audience.js -o \"$DEPLOY_PATH/assets/js/audience.js\";
            bye
          "

      - name: Verify public production
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl -fsSL --retry 3 --max-time 25 'https://villanuevoportil.com/off-season/sv/?v=894' -o live.html
          curl -fsSL --retry 3 --max-time 25 'https://villanuevoportil.com/assets/js/audience.js?v=8.9.4' -o live-audience.js
          grep -q 'class="sv-hero-price"' live.html
          grep -q 'Från 371 € per person för 7 nätter' live.html
          grep -q 'Pris per person beräknat på 7 nätter för 6 vuxna.' live.html
          grep -q 'Golf på gångavstånd' live.html
          grep -q 'Se lediga datum och totalpris →' live.html
          grep -q 'Nödvändiga cookies är alltid aktiva.' live-audience.js
          node --check live-audience.js
          echo 'V8.9.4 public verification OK'

      - name: Upload backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v894-sv-production-backup
          path: backup/
          retention-days: 14
