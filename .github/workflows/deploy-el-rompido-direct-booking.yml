name: Deploy El Rompido direct booking link
run-name: Replace Golf El Rompido booking link with official TeeOne direct booking

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-el-rompido-direct-booking.yml
      - scripts/update-el-rompido-direct-booking.py
  workflow_dispatch:

concurrency:
  group: villa-almale-el-rompido-direct-booking-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Backup, patch, deploy and verify off-season pages
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SCHEME: ${{ secrets.INFOMANIAK_SCHEME }}
      DEPLOY_HOST: ${{ secrets.INFOMANIAK_HOST }}
      DEPLOY_PORT: ${{ secrets.INFOMANIAK_PORT }}
      DEPLOY_USER: ${{ secrets.INFOMANIAK_USER }}
      DEPLOY_PASSWORD: ${{ secrets.INFOMANIAK_PASSWORD }}
      DEPLOY_PATH: ${{ secrets.INFOMANIAK_PATH }}
      NEW_URL: https://open.teeone.golf/es/rompido/disponibilidad

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate production target and install tools
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOY_PATH" = "sites/PageWebbasique1"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PASSWORD"
          sudo apt-get update
          sudo apt-get install -y lftp
          python3 -m pip install --disable-pip-version-check beautifulsoup4
          python3 -m py_compile scripts/update-el-rompido-direct-booking.py

      - name: Download and archive current pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live/off-season/fr live/off-season/es before/off-season/fr before/off-season/es after/off-season/fr after/off-season/es
          {
            echo 'set cmd:fail-exit yes;'
            echo 'set net:max-retries 3;'
            echo 'set net:timeout 30;'
            echo 'set sftp:auto-confirm yes;'
            printf 'open -p %q -u %q,%q %q://%q;\n' "$DEPLOY_PORT" "$DEPLOY_USER" "$DEPLOY_PASSWORD" "$DEPLOY_SCHEME" "$DEPLOY_HOST"
            printf 'get %q -o %q;\n' "$DEPLOY_PATH/off-season/index.html" "live/off-season/index.html"
            printf 'get %q -o %q;\n' "$DEPLOY_PATH/off-season/fr/index.html" "live/off-season/fr/index.html"
            printf 'get %q -o %q;\n' "$DEPLOY_PATH/off-season/es/index.html" "live/off-season/es/index.html"
            echo 'bye'
          } > download-before.lftp
          lftp -f download-before.lftp
          test -s live/off-season/index.html
          test -s live/off-season/fr/index.html
          test -s live/off-season/es/index.html
          cp live/off-season/index.html before/off-season/index.html
          cp live/off-season/fr/index.html before/off-season/fr/index.html
          cp live/off-season/es/index.html before/off-season/es/index.html
          tar -czf "villa-almale-before-el-rompido-${GITHUB_RUN_ID}.tar.gz" -C before .

      - name: Replace El Rompido booking links
        shell: bash
        run: |
          set -euo pipefail
          : > update.log
          for file in live/off-season/index.html live/off-season/fr/index.html live/off-season/es/index.html; do
            python3 scripts/update-el-rompido-direct-booking.py "$file" | tee -a update.log
            grep -Fq "$NEW_URL" "$file"
            ! grep -Fiq 'teetimesbooking.com/club/golf-el-rompido' "$file"
          done

      - name: Upload targeted pages
        shell: bash
        run: |
          set -euo pipefail
          touch deploy-started
          {
            echo 'set cmd:fail-exit yes;'
            echo 'set net:max-retries 3;'
            echo 'set net:timeout 30;'
            echo 'set sftp:auto-confirm yes;'
            printf 'open -p %q -u %q,%q %q://%q;\n' "$DEPLOY_PORT" "$DEPLOY_USER" "$DEPLOY_PASSWORD" "$DEPLOY_SCHEME" "$DEPLOY_HOST"
            printf 'put -O %q %q;\n' "$DEPLOY_PATH/off-season" "live/off-season/index.html"
            printf 'put -O %q %q;\n' "$DEPLOY_PATH/off-season/fr" "live/off-season/fr/index.html"
            printf 'put -O %q %q;\n' "$DEPLOY_PATH/off-season/es" "live/off-season/es/index.html"
            echo 'bye'
          } > upload.lftp
          lftp -f upload.lftp 2>&1 | tee upload.log

      - name: Compare remote files byte for byte
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'set cmd:fail-exit yes;'
            echo 'set net:max-retries 3;'
            echo 'set net:timeout 30;'
            echo 'set sftp:auto-confirm yes;'
            printf 'open -p %q -u %q,%q %q://%q;\n' "$DEPLOY_PORT" "$DEPLOY_USER" "$DEPLOY_PASSWORD" "$DEPLOY_SCHEME" "$DEPLOY_HOST"
            printf 'get %q -o %q;\n' "$DEPLOY_PATH/off-season/index.html" "after/off-season/index.html"
            printf 'get %q -o %q;\n' "$DEPLOY_PATH/off-season/fr/index.html" "after/off-season/fr/index.html"
            printf 'get %q -o %q;\n' "$DEPLOY_PATH/off-season/es/index.html" "after/off-season/es/index.html"
            echo 'bye'
          } > download-after.lftp
          lftp -f download-after.lftp
          cmp live/off-season/index.html after/off-season/index.html
          cmp live/off-season/fr/index.html after/off-season/fr/index.html
          cmp live/off-season/es/index.html after/off-season/es/index.html
          tar -czf "villa-almale-after-el-rompido-${GITHUB_RUN_ID}.tar.gz" -C after .

      - name: Verify public pages
        shell: bash
        run: |
          set -euo pipefail
          verify_page() {
            local lang="$1"
            local url="$2"
            local output="public-${lang}.html"
            local verified=0
            for attempt in $(seq 1 24); do
              if curl -L --retry 3 --retry-delay 2 -fsS -H 'Cache-Control: no-cache' "${url}?elrompidocheck=${GITHUB_RUN_ID}-${attempt}" -o "$output" \
                && grep -Fq "$NEW_URL" "$output" \
                && ! grep -Fiq 'teetimesbooking.com/club/golf-el-rompido' "$output"; then
                echo "${lang}: verified publicly on attempt ${attempt}."
                verified=1
                break
              fi
              sleep 5
            done
            test "$verified" -eq 1
          }
          verify_page en 'https://villanuevoportil.com/off-season/'
          verify_page fr 'https://villanuevoportil.com/off-season/fr/'
          verify_page es 'https://villanuevoportil.com/off-season/es/'

      - name: Restore backups on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          if [ ! -f deploy-started ] || [ ! -f before/off-season/index.html ]; then
            echo 'Deployment did not start; no rollback required.'
            exit 0
          fi
          {
            echo 'set cmd:fail-exit yes;'
            echo 'set net:max-retries 3;'
            echo 'set net:timeout 30;'
            echo 'set sftp:auto-confirm yes;'
            printf 'open -p %q -u %q,%q %q://%q;\n' "$DEPLOY_PORT" "$DEPLOY_USER" "$DEPLOY_PASSWORD" "$DEPLOY_SCHEME" "$DEPLOY_HOST"
            printf 'put -O %q %q;\n' "$DEPLOY_PATH/off-season" "before/off-season/index.html"
            printf 'put -O %q %q;\n' "$DEPLOY_PATH/off-season/fr" "before/off-season/fr/index.html"
            printf 'put -O %q %q;\n' "$DEPLOY_PATH/off-season/es" "before/off-season/es/index.html"
            echo 'bye'
          } > rollback.lftp
          lftp -f rollback.lftp

      - name: Preserve deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: villa-almale-el-rompido-${{ github.run_id }}
          path: |
            villa-almale-before-el-rompido-${{ github.run_id }}.tar.gz
            villa-almale-after-el-rompido-${{ github.run_id }}.tar.gz
            update.log
            upload.log
          retention-days: 90
          if-no-files-found: warn
