name: Inspect Meta pixel config via curl

on:
  push:
    paths:
      - 'releases/v89-meta-config-curl/RUN'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Meta signals config
        shell: bash
        run: |
          set -euo pipefail
          URL='https://connect.facebook.net/signals/config/813403868466271?v=2.9.373&r=stable&domain=villanuevoportil.com'
          curl -fsSL --max-time 20 -A 'Mozilla/5.0' "$URL" -o config.js
          wc -c config.js
          echo '--- pixel-specific statements ---'
          python3 - <<'PY'
          from pathlib import Path
          s=Path('config.js').read_text(errors='replace')
          pid='813403868466271'
          pos=0
          seen=0
          while True:
              i=s.find(pid,pos)
              if i<0: break
              seen+=1
              print(f'[{seen}]',s[max(0,i-300):min(len(s),i+700)].replace('\n',' '))
              pos=i+len(pid)
          print('PIXEL_ID_OCCURRENCES=',seen)
          PY
          echo '--- optIn/optOut/config.set ---'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('config.js').read_text(errors='replace')
          pid='813403868466271'
          for pat in [r'instance\.optIn\([^;]+;',r'instance\.optOut\([^;]+;',r'config\.set\([^;]+;']:
              for m in re.finditer(pat,s):
                  text=m.group(0)
                  if pid in text:
                      print(text)
          PY
