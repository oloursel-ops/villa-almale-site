name: Trigger Villa Almale V8.1 via one controlled issue
run-name: Dispatch V8.1 from the controlled deployment issue

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.title == '[deploy] Villa Almale V8.1 off-season' && github.event.issue.user.login == 'oloursel-ops') }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch V8.1 production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/deploy-v8-1-offseason-conversion.yml/dispatches" \
            --data '{"ref":"main"}'

      - name: Close the controlled trigger issue
        if: ${{ github.event_name == 'issues' && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --data '{"state":"closed","state_reason":"completed"}'

      - name: Disable this one-shot issue trigger
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/trigger-v8-1-via-issue.yml/disable"
