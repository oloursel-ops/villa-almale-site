name: Trigger Villa Almale V8.1 via controlled PR
run-name: Dispatch the registered V8.1 ARM workflow

on:
  pull_request_target:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.event.pull_request.title == '[deploy] Villa Almale V8.1 ARM' && github.event.pull_request.user.login == 'oloursel-ops' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Dispatch registered V8.1 workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/deploy-v8-1-offseason-conversion.yml/dispatches" \
            --data '{"ref":"main"}'

      - name: Disable this one-shot trigger
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/trigger-v8-1-via-pr.yml/disable"
