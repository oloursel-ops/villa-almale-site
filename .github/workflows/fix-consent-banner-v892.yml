name: Fix Villa Almale consent banner buttons V8.9.2

on:
  push:
    paths:
      - 'releases/v892-consent-banner/DEPLOY'

concurrency:
  group: villa-almale-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Download current production audience.js
        env:
          DEPLOY_SCHEME: ${{ secrets.INFOMANIAK_SCHEME }}
          DEPLOY_HOST: ${{ secrets.INFOMANIAK_HOST }}
          DEPLOY_PORT: ${{ secrets.INFOMANIAK_PORT }}
          DEPLOY_USER: ${{ secrets.INFOMANIAK_USER }}
          DEPLOY_PASSWORD: ${{ secrets.INFOMANIAK_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.INFOMANIAK_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_SCHEME:?Missing INFOMANIAK_SCHEME}"
          : "${DEPLOY_HOST:?Missing INFOMANIAK_HOST}"
          : "${DEPLOY_PORT:?Missing INFOMANIAK_PORT}"
          : "${DEPLOY_USER:?Missing INFOMANIAK_USER}"
          : "${DEPLOY_PASSWORD:?Missing INFOMANIAK_PASSWORD}"
          test "$DEPLOY_PATH" = "sites/PageWebbasique1"
          case "$DEPLOY_SCHEME" in
            sftp) EXTRA_SETTINGS="set sftp:auto-confirm yes;" ;;
            ftp) EXTRA_SETTINGS="set ftp:ssl-allow no; set ftp:passive-mode yes;" ;;
            ftps) EXTRA_SETTINGS="set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ftp:passive-mode yes;" ;;
            *) exit 1 ;;
          esac
          mkdir -p work backup verify
          lftp -c "set cmd:fail-exit yes; set net:max-retries 2; set net:timeout 30; $EXTRA_SETTINGS open -p $DEPLOY_PORT -u \"$DEPLOY_USER\",\"$DEPLOY_PASSWORD\" $DEPLOY_SCHEME://$DEPLOY_HOST; get \"$DEPLOY_PATH/assets/js/audience.js\" -o work/audience.js; bye"
          cp work/audience.js backup/audience.js

      - name: Force horizontal desktop actions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/audience.js')
          s=p.read_text(encoding='utf-8')
          guards=['villa_privacy_consent_v89','813403868466271','width:min(650px']
          for g in guards:
              if g not in s:
                  raise SystemExit(f'Missing V8.9.1 guard: {g}')
          old=".audience-actions{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:8px!important;margin-top:11px!important}"
          new=".audience-consent .audience-actions{display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;align-items:stretch!important;width:100%!important;gap:8px!important;margin:11px 0 0!important;padding:0!important}.audience-consent .audience-actions>.audience-button{flex:1 1 0!important;grid-column:auto!important;grid-row:auto!important;float:none!important;position:static!important}"
          if s.count(old)!=1:
              raise SystemExit(f'Expected current desktop actions rule once, found {s.count(old)}')
          s=s.replace(old,new,1)
          old_mobile="@media(max-width:640px){.audience-consent{bottom:8px!important;width:calc(100% - 16px)!important;padding:13px!important}.audience-consent p{font-size:.8rem!important}.audience-actions{grid-template-columns:1fr!important;gap:6px!important;margin-top:9px!important}.audience-button{min-height:36px!important}}"
          new_mobile="@media(max-width:640px){.audience-consent{bottom:8px!important;width:calc(100% - 16px)!important;padding:13px!important}.audience-consent p{font-size:.8rem!important}.audience-consent .audience-actions{flex-direction:column!important;gap:6px!important;margin-top:9px!important}.audience-consent .audience-actions>.audience-button{width:100%!important;flex:0 0 auto!important;min-height:36px!important}}"
          if s.count(old_mobile)!=1:
              raise SystemExit(f'Expected current mobile rule once, found {s.count(old_mobile)}')
          s=s.replace(old_mobile,new_mobile,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -F '.audience-consent .audience-actions{display:flex!important;flex-direction:row!important' work/audience.js
          grep -F '.audience-consent .audience-actions>.audience-button{flex:1 1 0!important' work/audience.js
          grep -F 'flex-direction:column!important' work/audience.js
          grep -F '813403868466271' work/audience.js

      - name: Upload temp and verify bytes
        env:
          DEPLOY_SCHEME: ${{ secrets.INFOMANIAK_SCHEME }}
          DEPLOY_HOST: ${{ secrets.INFOMANIAK_HOST }}
          DEPLOY_PORT: ${{ secrets.INFOMANIAK_PORT }}
          DEPLOY_USER: ${{ secrets.INFOMANIAK_USER }}
          DEPLOY_PASSWORD: ${{ secrets.INFOMANIAK_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.INFOMANIAK_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_SCHEME" in
            sftp) EXTRA_SETTINGS="set sftp:auto-confirm yes;" ;;
            ftp) EXTRA_SETTINGS="set ftp:ssl-allow no; set ftp:passive-mode yes;" ;;
            ftps) EXTRA_SETTINGS="set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ftp:passive-mode yes;" ;;
          esac
          lftp -c "set cmd:fail-exit yes; $EXTRA_SETTINGS open -p $DEPLOY_PORT -u \"$DEPLOY_USER\",\"$DEPLOY_PASSWORD\" $DEPLOY_SCHEME://$DEPLOY_HOST; put work/audience.js -o \"$DEPLOY_PATH/assets/js/audience.js.v892tmp\"; get \"$DEPLOY_PATH/assets/js/audience.js.v892tmp\" -o verify/audience.js; bye"
          cmp work/audience.js verify/audience.js

      - name: Publish with rollback
        env:
          DEPLOY_SCHEME: ${{ secrets.INFOMANIAK_SCHEME }}
          DEPLOY_HOST: ${{ secrets.INFOMANIAK_HOST }}
          DEPLOY_PORT: ${{ secrets.INFOMANIAK_PORT }}
          DEPLOY_USER: ${{ secrets.INFOMANIAK_USER }}
          DEPLOY_PASSWORD: ${{ secrets.INFOMANIAK_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.INFOMANIAK_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_SCHEME" in
            sftp) EXTRA_SETTINGS="set sftp:auto-confirm yes;" ;;
            ftp) EXTRA_SETTINGS="set ftp:ssl-allow no; set ftp:passive-mode yes;" ;;
            ftps) EXTRA_SETTINGS="set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ftp:passive-mode yes;" ;;
          esac
          set +e
          lftp -c "set cmd:fail-exit yes; $EXTRA_SETTINGS open -p $DEPLOY_PORT -u \"$DEPLOY_USER\",\"$DEPLOY_PASSWORD\" $DEPLOY_SCHEME://$DEPLOY_HOST; put work/audience.js -o \"$DEPLOY_PATH/assets/js/audience.js\"; bye"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            lftp -c "set cmd:fail-exit yes; $EXTRA_SETTINGS open -p $DEPLOY_PORT -u \"$DEPLOY_USER\",\"$DEPLOY_PASSWORD\" $DEPLOY_SCHEME://$DEPLOY_HOST; put backup/audience.js -o \"$DEPLOY_PATH/assets/js/audience.js\"; bye"
            exit "$rc"
          fi
          lftp -c "set cmd:fail-exit yes; $EXTRA_SETTINGS open -p $DEPLOY_PORT -u \"$DEPLOY_USER\",\"$DEPLOY_PASSWORD\" $DEPLOY_SCHEME://$DEPLOY_HOST; rm -f \"$DEPLOY_PATH/assets/js/audience.js.v892tmp\"; get \"$DEPLOY_PATH/assets/js/audience.js\" -o verify/live.js; bye"
          cmp work/audience.js verify/live.js
